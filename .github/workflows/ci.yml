name: CI

on:
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: ${{ github.event.pull_request.draft == false && !startsWith(github.head_ref, 'dependabot') }}
    runs-on: [arc-runner-set]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v5

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Build
        run: pnpm run build

  e2e:
    if: ${{ github.event.pull_request.draft == false && !startsWith(github.head_ref, 'dependabot') }}
    runs-on: [arc-runner-set]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v5

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      # Not `pnpm exec playwright`: vocs ships its own playwright, and which
      # copy pnpm links into node_modules/.bin varies with install order.
      - name: Install Playwright browser
        run: node node_modules/@playwright/test/cli.js install --with-deps chromium

      # Builds the site and serves it -- see playwright.config.ts.
      - name: Run browser tests
        run: pnpm run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  typo-check:
    if: ${{ github.event.pull_request.draft == false && !startsWith(github.head_ref, 'dependabot') }}
    runs-on: [arc-runner-set]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install wget
        run: |
          if ! command -v wget &> /dev/null; then
            sudo apt-get update && sudo apt-get install -y wget
          fi

      - name: Check for typos
        uses: crate-ci/typos@v1.44.0
        with:
          config: ${{ github.workspace }}/_typos.toml

      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --verbose "**/README.md" --accept '429, 200'
